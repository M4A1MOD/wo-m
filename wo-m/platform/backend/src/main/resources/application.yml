server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/smart-teaching;MODE=MySQL;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
    open-in-view: false

app:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  jwt-secret: ${JWT_SECRET:replace_with_a_long_random_secret}
