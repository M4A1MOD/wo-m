<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52647a"/></marker>
    <style>
      .title{font:700 34px 'Microsoft YaHei',sans-serif;fill:#182230}.subtitle{font:400 17px 'Microsoft YaHei',sans-serif;fill:#637083}
      .layer{font:700 20px 'Microsoft YaHei',sans-serif;fill:#243249}.node{font:700 18px 'Microsoft YaHei',sans-serif;fill:#182230}.desc{font:400 14px 'Microsoft YaHei',sans-serif;fill:#52647a}
      .box{rx:18;ry:18;stroke-width:2}.line{stroke:#52647a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f7f9fc"/>
  <text x="720" y="54" text-anchor="middle" class="title">智能互动教学平台总体架构</text>
  <text x="720" y="86" text-anchor="middle" class="subtitle">Vue 3 前端  Spring Boot 业务后端  FastAPI AI 服务</text>

  <rect x="55" y="125" width="1330" height="130" class="box" fill="#eef3ff" stroke="#90a8f8"/>
  <text x="80" y="158" class="layer">用户与前端层</text>
  <rect x="250" y="150" width="250" height="80" class="box" fill="#ffffff" stroke="#b9c7ef"/>
  <text x="375" y="183" text-anchor="middle" class="node">教师工作台</text><text x="375" y="207" text-anchor="middle" class="desc">生成  编辑  审核  发布</text>
  <rect x="595" y="150" width="250" height="80" class="box" fill="#ffffff" stroke="#b9c7ef"/>
  <text x="720" y="183" text-anchor="middle" class="node">学生互动课堂</text><text x="720" y="207" text-anchor="middle" class="desc">学习  提问  测验  反馈</text>
  <rect x="940" y="150" width="250" height="80" class="box" fill="#ffffff" stroke="#b9c7ef"/>
  <text x="1065" y="183" text-anchor="middle" class="node">Vue 3 应用</text><text x="1065" y="207" text-anchor="middle" class="desc">Router  Pinia  Axios  TypeScript</text>

  <rect x="55" y="300" width="1330" height="210" class="box" fill="#effaf6" stroke="#74c9a8"/>
  <text x="80" y="334" class="layer">业务服务层  Spring Boot 3</text>
  <rect x="170" y="365" width="220" height="100" class="box" fill="#ffffff" stroke="#98d8bf"/><text x="280" y="402" text-anchor="middle" class="node">认证与权限</text><text x="280" y="429" text-anchor="middle" class="desc">JWT 角色授权 审计</text>
  <rect x="440" y="365" width="220" height="100" class="box" fill="#ffffff" stroke="#98d8bf"/><text x="550" y="402" text-anchor="middle" class="node">课程与课堂</text><text x="550" y="429" text-anchor="middle" class="desc">CRUD 状态 审核 发布</text>
  <rect x="710" y="365" width="220" height="100" class="box" fill="#ffffff" stroke="#98d8bf"/><text x="820" y="402" text-anchor="middle" class="node">测验与学情</text><text x="820" y="429" text-anchor="middle" class="desc">题目 答题 评分 结果</text>
  <rect x="980" y="365" width="220" height="100" class="box" fill="#ffffff" stroke="#98d8bf"/><text x="1090" y="402" text-anchor="middle" class="node">AI 调用适配</text><text x="1090" y="429" text-anchor="middle" class="desc">超时 重试 降级 Schema 校验</text>

  <rect x="55" y="555" width="840" height="280" class="box" fill="#fff7ed" stroke="#e8b66d"/>
  <text x="80" y="589" class="layer">AI 服务层  FastAPI</text>
  <rect x="120" y="625" width="210" height="90" class="box" fill="#ffffff" stroke="#ecc98e"/><text x="225" y="660" text-anchor="middle" class="node">LangChain 智能体</text><text x="225" y="686" text-anchor="middle" class="desc">大纲 课堂 问答 测验</text>
  <rect x="370" y="625" width="210" height="90" class="box" fill="#ffffff" stroke="#ecc98e"/><text x="475" y="660" text-anchor="middle" class="node">RAG 检索</text><text x="475" y="686" text-anchor="middle" class="desc">解析 分段 向量 召回</text>
  <rect x="620" y="625" width="210" height="90" class="box" fill="#ffffff" stroke="#ecc98e"/><text x="725" y="660" text-anchor="middle" class="node">YOLOv8 推理</text><text x="725" y="686" text-anchor="middle" class="desc">图像识别 可插拔接口</text>
  <rect x="245" y="745" width="230" height="65" class="box" fill="#ffffff" stroke="#ecc98e"/><text x="360" y="784" text-anchor="middle" class="node">LLM 提供商适配</text>
  <rect x="505" y="745" width="230" height="65" class="box" fill="#ffffff" stroke="#ecc98e"/><text x="620" y="784" text-anchor="middle" class="node">PyTorch 训练模型</text>

  <rect x="940" y="555" width="445" height="280" class="box" fill="#f5f1ff" stroke="#b39ae5"/>
  <text x="965" y="589" class="layer">数据与基础设施层</text>
  <rect x="1000" y="625" width="150" height="90" class="box" fill="#ffffff" stroke="#c9b8ec"/><text x="1075" y="661" text-anchor="middle" class="node">MySQL</text><text x="1075" y="686" text-anchor="middle" class="desc">业务数据</text>
  <rect x="1180" y="625" width="150" height="90" class="box" fill="#ffffff" stroke="#c9b8ec"/><text x="1255" y="661" text-anchor="middle" class="node">向量库</text><text x="1255" y="686" text-anchor="middle" class="desc">pgvector Chroma</text>
  <rect x="1000" y="745" width="150" height="65" class="box" fill="#ffffff" stroke="#c9b8ec"/><text x="1075" y="784" text-anchor="middle" class="node">对象存储</text>
  <rect x="1180" y="745" width="150" height="65" class="box" fill="#ffffff" stroke="#c9b8ec"/><text x="1255" y="784" text-anchor="middle" class="node">日志监控</text>

  <path d="M720 255 L720 300" class="line"/><path d="M1090 465 C1090 525 850 540 780 625" class="line"/>
  <path d="M550 465 C550 530 1075 520 1075 625" class="line"/><path d="M475 715 C475 735 1160 710 1255 625" class="line dash"/>
