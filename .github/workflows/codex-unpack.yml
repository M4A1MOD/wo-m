name: Codex unpack project
on:
  push:
    branches: [main]
    paths:
      - 'codex-upload-*.zip'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find . -maxdepth 1 -name 'codex-upload-*.zip' -print -quit)
          test -n "$archive"
          unzip -o "$archive" -d .
          rm -f "$archive" .github/workflows/codex-unpack.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add smart teaching platform Demo 0.4 source and design docs"
          git push
