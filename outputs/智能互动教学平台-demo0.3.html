<div class="app"><aside><div class="brand"><b>智</b><span>智学<small>Demo 0.3 · 统一正式版</small></span></div><nav><button :class="{active:page==='home'}" @click="page='home'">⌂ <span>工作台</span></button><button :class="{active:page==='generate'}" @click="page='generate'">✦ <span>生成课堂</span></button><button :class="{active:page==='lesson'}" @click="page='lesson'">▣ <span>互动课堂</span></button><button :class="{active:page==='library'}" @click="page='library'">▤ <span>学科资源</span></button></nav><div class="note"><b>Demo 0.3 正式版</b>整合 0.2 的课程 CRUD、后端持久化与离线降级，以及 0.3 的多学科生成、问答、测验、审核和导出。<br><i>● {{apiOnline?'业务后端在线':'本地持久化可用'}}</i><br><i>● {{aiOnline?'AI 服务在线':'学科模板降级可用'}}</i></div></aside>
<main><header><span>智学 / <b>{{page==='home'?'工作台':page==='generate'?'生成课堂':page==='lesson'?'互动课堂':'学科资源'}}</b></span><div><span class="status">● {{apiOnline?'全栈服务在线':'离线演示在线'}}</span><span class="avatar">师</span></div></header>
<section v-if="page==='home'"><div class="hero"><div><span class="hero-tag">DEMO 0.3 · SUBJECT-AWARE</span><h1>一套平台，讲好每一门学科</h1><p>语数英、历史地理、生物化学与道德法治，使用符合学科特点的课堂活动和评价方式。</p></div><button class="hero-button" @click="page='generate'">生成新课堂 →</button></div><div class="section-head"><div><h2>课堂中心</h2><p>已有 {{courses.length}} 门课堂，支持离线保存与再次打开</p></div><div class="filters"><button v-for="x in ['全部',...subjects]" :class="{active:subjectFilter===x}" @click="subjectFilter=x">{{x}}</button></div></div><div class="grid"><article v-for="c in visibleCourses" :key="c.id" class="card course-card"><div class="card-top"><span class="subject-badge">{{c.subject}}</span><span class="state" :class="{published:c.status==='PUBLISHED'}">{{c.status==='PUBLISHED'?'已发布':'待审核'}}</span></div><h3>{{c.title}}</h3><p>{{c.grade}} · {{c.duration}} 分钟 · {{c.scenes.length}} 个课堂场景</p><div class="knowledge-preview"><span v-for="x in c.keyPoints.slice(0,3)">{{x}}</span></div><footer><small>{{c.updatedAt}}</small><div><button @click="open(c)">打开课堂</button><button class="danger" @click="remove(c.id)">删除</button></div></footer></article><div v-if="!visibleCourses.length" class="empty">该学科还没有课堂，点击“生成课堂”创建第一节。</div></div></section>
<section v-else-if="page==='generate'"><div class="page-title"><span>AI 教学设计</span><h1>生成符合学科特点的完整课堂</h1><p>选择学科与年级后，系统会调整教学目标、课堂流程、互动形式、测验和评价标准。</p></div><div class="generate-layout"><div class="panel form-panel"><label>课程主题<input v-model="topic" @keyup.enter="generate" placeholder="例如：丝绸之路的交流与影响"></label><div class="two-col"><label>学科<select v-model="subject"><option v-for="x in subjects">{{x}}</option></select></label><label>年级<select v-model="grade"><option v-for="x in ['七年级','八年级','九年级','高一','高二','高三']">{{x}}</option></select></label></div><button class="primary wide" :disabled="loading" @click="generate">{{loading?'正在组织学科内容…':'生成并保存完整课堂'}}</button><p class="hint">自动生成：教学目标、重难点、5 个课堂场景、师生活动、互动任务、测验解析、作业、资源与评价方案。</p></div><div class="panel examples"><h3>多学科示例</h3><button @click="chooseTopic('唐诗中的月亮意象','语文','高二')"><b>语文</b><span>文本细读与证据表达</span></button><button @click="chooseTopic('二次函数的图像与性质','数学','九年级')"><b>数学</b><span>数形结合与参数探究</span></button><button @click="chooseTopic('Travel Plans：旅行情境口语','英语','八年级')"><b>英语</b><span>听说输入与角色任务</span></button><button @click="chooseTopic('丝绸之路：跨文明交流','历史','七年级')"><b>历史</b><span>时空定位与史料实证</span></button><button @click="chooseTopic('季风气候与我们的生活','地理','八年级')"><b>地理</b><span>地图判读与区域决策</span></button></div></div></section>
<section v-else-if="page==='lesson' && current" class="lesson-page"><div class="lesson-toolbar"><div><span class="subject-badge">{{current.subject}}</span><h1>{{current.title}}</h1><p>{{current.grade}} · {{current.duration}} 分钟 · {{current.status==='PUBLISHED'?'已审核发布':'AI 草稿待审核'}}</p></div><div class="toolbar-actions"><button @click="publish">{{current.status==='PUBLISHED'?'退回草稿':'✓ 审核并发布'}}</button><button @click="jsonExport">导出 JSON</button><button class="primary" @click="htmlExport">导出完整课堂 HTML ↗</button></div></div><div class="lesson-layout"><aside class="scene-nav"><div class="plan-summary"><b>课堂导航</b><span>{{current.scenes.length}} 个场景 · {{current.duration}} 分钟</span></div><button v-for="(s,i) in current.scenes" :class="{active:sceneIndex===i}" @click="selectScene(i)"><em>{{String(i+1).padStart(2,'0')}}</em><span><b>{{s.title}}</b><small>{{s.duration}} 分钟 · {{s.interaction}}</small></span></button><div class="export-note"><b>导出内容已完善</b><span>目标、重难点、师生活动、测验答案、作业、资源、评价方案均会写入文件。</span></div></aside><div class="stage"><div class="scene-hero"><div><span>{{currentScene.type}} · {{currentScene.duration}} MIN</span><h2>{{currentScene.headline}}</h2><p>{{currentScene.content}}</p></div><div class="scene-number">{{String(sceneIndex+1).padStart(2,'0')}}</div></div><div class="activity-grid"><article><small>教师活动</small><p>{{currentScene.teacherActivity}}</p></article><article><small>学生活动</small><p>{{currentScene.studentActivity}}</p></article><article><small>互动任务</small><p>{{currentScene.interaction}}</p></article></div><div class="knowledge-row"><b>本场景知识点</b><span v-for="x in currentScene.knowledge">{{x}}</span></div><div class="teacher-chat"><div class="chat-head"><b>AI 教师问答</b><span>{{aiOnline?'课程上下文已连接':'当前使用启发式降级回答'}}</span></div><div v-if="chatHistory.length" class="chat-list"><div v-for="item in chatHistory" :class="item.role"><b>{{item.role==='student'?'我':'AI 教师'}}</b><p>{{item.content}}</p></div></div><div v-else class="chat-empty">围绕当前场景提问，AI 教师会结合学科、年级和知识点启发回答。</div><form class="chat-input" @submit.prevent="askTeacher"><input v-model="aiQuestion" placeholder="例如：这个知识点在新情境中怎么判断？"><button class="primary" :disabled="aiLoading">{{aiLoading?'思考中…':'提问'}}</button></form></div><div class="quiz-box" v-if="sceneIndex===current.scenes.length-1"><div class="quiz-head"><div><small>即时测验 · {{current.quiz[0].knowledge}}</small><h3>{{current.quiz[0].question}}</h3></div><span>1 / {{current.quiz.length}}</span></div><button v-for="(option,i) in current.quiz[0].options" class="option" :class="{selected:selectedAnswer===i,correct:showAnswer&&i===current.quiz[0].answer,wrong:showAnswer&&selectedAnswer===i&&i!==current.quiz[0].answer}" @click="answer(i)">{{String.fromCharCode(65+i)}}. {{option}}</button><div v-if="showAnswer" class="analysis"><b>{{selectedAnswer===current.quiz[0].answer?'回答正确':'继续加油'}}</b>{{current.quiz[0].analysis}}</div></div><div class="stage-footer"><button :disabled="sceneIndex===0" @click="selectScene(sceneIndex-1)">← 上一场景</button><span>课堂进度 <b>{{Math.round((sceneIndex+1)/current.scenes.length*100)}}%</b></span><button :disabled="sceneIndex===current.scenes.length-1" @click="selectScene(sceneIndex+1)">下一场景 →</button></div></div><aside class="design-panel"><h3>教学设计摘要</h3><section><b>教学目标</b><ol><li v-for="x in current.objectives">{{x}}</li></ol></section><section><b>教学重点</b><div class="mini-tags"><span v-for="x in current.keyPoints">{{x}}</span></div></section><section><b>教学难点</b><ul><li v-for="x in current.difficultPoints">{{x}}</li></ul></section><section><b>评价方案</b><ul><li v-for="x in current.assessment">{{x}}</li></ul></section></aside></div></section>
