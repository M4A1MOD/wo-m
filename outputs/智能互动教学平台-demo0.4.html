<main><header><span>智学 / <b>{{({home:'教学工作台',generate:'智能生成',knowledge:'知识库与知识图谱',multimodal:'多模态内容',lesson:'互动课堂',agents:'多智能体协同课堂',analytics:'学习记录与分析',library:'学科资源'})[page]}}</b></span><div><span class="status">● {{apiOnline?'全栈服务在线':'离线演示在线'}}</span><span class="model-chip">{{provider}}</span><span class="avatar">师</span></div></header>

<section v-if="page==='home'"><div class="hero hero04"><div><span class="hero-tag">DEMO 0.4 · KNOWLEDGE-GROUNDED</span><h1>真人教师与 AI 导师协同的智能课堂</h1><p>上传课程资料后构建知识图谱，自动生成文本、测验、PPT、音频、思维导图和互动教材，并由多智能体陪伴教学与分析学习效果。</p></div><button class="hero-button" @click="go('generate')">创建 0.4 课堂 →</button></div><div class="metric-grid"><article><span>课程知识库</span><b>{{courses.reduce((n,c)=>n+c.demo04.materials.length,0)}}</b><small>教材与课件已解析</small></article><article><span>知识图谱</span><b>{{current.demo04.knowledgeGraph.nodes.length}}</b><small>知识点 · 4 类关系</small></article><article><span>班级掌握度</span><b>{{averageMastery}}%</b><small>{{weakNodes.length}} 个薄弱知识点</small></article><article><span>学习时长</span><b>{{totalMinutes}}m</b><small>浏览、测验、讨论全记录</small></article></div><div class="section-head"><div><h2>课程发布与管理</h2><p>教师端统一管理课程、知识库、发布状态与课堂数据</p></div><div class="filters"><button v-for="x in ['全部',...subjects]" :class="{active:subjectFilter===x}" @click="subjectFilter=x">{{x}}</button></div></div><div class="grid"><article v-for="c in visibleCourses" :key="c.id" class="card course-card"><div class="card-top"><span class="subject-badge">{{c.subject}}</span><span class="state" :class="{published:c.status==='PUBLISHED'}">{{c.status==='PUBLISHED'?'已发布':'待审核'}}</span></div><h3>{{c.title}}</h3><p>{{c.grade}} · {{c.scenes.length}} 个场景 · {{c.demo04.knowledgeGraph.nodes.length}} 个知识点</p><div class="knowledge-preview"><span v-for="x in c.keyPoints.slice(0,3)">{{x}}</span></div><footer><small>{{c.updatedAt}}</small><div><button @click="open(c)">进入课堂</button><button @click="open(c,'analytics')">学情</button><button class="danger" @click="remove(c.id)">删除</button></div></footer></article></div></section>

<section v-else-if="page==='generate'"><div class="page-title"><span>统一多模型生成引擎</span><h1>从主题或资料生成完整互动课堂</h1><p>课程大纲、知识图谱、六类内容、角色脚本、测验、项目任务和学习路径一次生成。</p></div><div class="generate-layout"><div class="panel form-panel"><label>课程主题<input v-model="topic" @keyup.enter="generate" placeholder="例如：丝绸之路的交流与影响"></label><div class="two-col"><label>学科<select v-model="subject"><option v-for="x in subjects">{{x}}</option></select></label><label>年级<select v-model="grade"><option v-for="x in ['七年级','八年级','九年级','高一','高二','高三']">{{x}}</option></select></label></div><div class="two-col"><label>模型提供商<select v-model="provider"><option v-for="x in ['DeepSeek','通义千问','Kimi','MiniMax','本地演示模型']">{{x}}</option></select></label><label>内容模式<select v-model="contentStyle"><option>综合模式</option><option>视觉优先</option><option>音频优先</option><option>项目式学习</option></select></label></div><label>课堂时长 <b>{{duration}} 分钟</b><input type="range" min="20" max="90" step="5" v-model.number="duration"></label><button class="primary wide" :disabled="loading" @click="generate">{{loading?'知识图谱约束生成中…':'生成 Demo 0.4 完整课堂'}}</button><p class="hint">真实模型可通过统一 Provider 接口接入；无密钥时自动使用稳定的多学科生成引擎，所有页面与导出仍可操作。</p></div><div class="panel examples"><h3>学科生成示例</h3><button @click="chooseTopic('唐诗中的月亮意象','语文','高二')"><b>语文</b><span>沉浸阅读与双 AI 朗读</span></button><button @click="chooseTopic('二次函数的图像与性质','数学','九年级')"><b>数学</b><span>参数模拟与分层测验</span></button><button @click="chooseTopic('Travel Plans：旅行情境口语','英语','八年级')"><b>英语</b><span>多语言语音与角色对话</span></button><button @click="chooseTopic('丝绸之路：跨文明交流','历史','七年级')"><b>历史</b><span>时空图谱与史料项目</span></button><button @click="chooseTopic('季风气候与我们的生活','地理','八年级')"><b>地理</b><span>地图判读与区域决策</span></button></div></div></section>

<section v-else-if="page==='knowledge' && current"><div class="page-bar"><div><span class="subject-badge">{{current.subject}}</span><h1>课程知识库与知识图谱</h1><p>{{current.title}} · 生成内容受当前图谱约束</p></div><div class="bar-actions"><label class="upload-btn">＋ 上传教材/课件<input type="file" multiple accept=".txt,.md,.pdf,.ppt,.pptx" @change="uploadMaterials"></label><button class="primary" @click="addNode">＋ 新增知识点</button></div></div><div class="knowledge-layout"><div class="panel"><div class="panel-title"><div><h3>课程资料</h3><small>文本清洗 · 智能切分 · 知识抽取 · 质量校验</small></div><span>{{current.demo04.materials.length}} 个文件</span></div><article v-for="m in current.demo04.materials" class="material-row"><b class="file-icon">{{m.type}}</b><div><strong>{{m.name}}</strong><small>{{m.size}} · {{m.chunks}} 个内容分块 · {{m.uploadedAt}}</small><p>{{m.summary}}</p><div class="mini-tags"><span v-for="x in m.points">{{x}}</span></div></div><button @click="deleteMaterial(m.id)">×</button></article><div v-if="!current.demo04.materials.length" class="empty">上传 TXT、MD、PDF 或 PPTX 构建课程知识库</div></div><div class="panel graph-panel"><div class="graph-toolbar"><div><h3>知识关系图</h3><small>点击节点查看和编辑；筛选前置、包含、因果与关联关系</small></div><select v-model="relationFilter"><option>全部</option><option>前置</option><option>包含</option><option>因果</option><option>关联</option></select><label>缩放 <input type="range" min="70" max="135" v-model.number="graphZoom"> {{graphZoom}}%</label></div><div class="graph-scroll"><svg class="knowledge-graph" viewBox="0 0 600 340" :style="{width:graphZoom+'%',height:(340*graphZoom/100)+'px'}"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa8d8"/></marker></defs><line v-for="e in graphEdges" :x1="current.demo04.knowledgeGraph.nodes.find(n=>n.id===e.from)?.x" :y1="current.demo04.knowledgeGraph.nodes.find(n=>n.id===e.from)?.y" :x2="current.demo04.knowledgeGraph.nodes.find(n=>n.id===e.to)?.x" :y2="current.demo04.knowledgeGraph.nodes.find(n=>n.id===e.to)?.y" :class="'edge '+e.type" marker-end="url(#arrow)"/><g v-for="n in current.demo04.knowledgeGraph.nodes" class="node" :class="{selected:selectedNodeId===n.id,weak:n.mastery<65}" @click="selectNode(n.id)"><circle :cx="n.x" :cy="n.y" :r="n.level===0?39:31"/><text :x="n.x" :y="n.y-2">{{n.label.length>8?n.label.slice(0,8)+'…':n.label}}</text><text class="mastery" :x="n.x" :y="n.y+14">{{n.mastery}}%</text></g></svg></div><div class="legend"><span><i class="includes"></i>包含</span><span><i class="prereq"></i>前置</span><span><i class="cause"></i>因果</span><span><i class="link"></i>关联</span></div></div><aside class="panel node-editor"><h3>知识点编辑</h3><template v-if="selectedNode"><label>名称<input v-model="nodeDraft"></label><label>掌握度<input type="range" min="0" max="100" v-model.number="selectedNode.mastery"><b>{{selectedNode.mastery}}%</b></label><label>说明<textarea v-model="selectedNode.description"></textarea></label><button class="primary wide" @click="saveNode">保存并同步生成约束</button><hr><b>关系</b><div v-for="e in current.demo04.knowledgeGraph.edges.filter(e=>e.from===selectedNode.id||e.to===selectedNode.id)" class="relation-item">{{e.type}} · {{current.demo04.knowledgeGraph.nodes.find(n=>n.id===(e.from===selectedNode.id?e.to:e.from))?.label}}</div></template></aside></div></section>

<section v-else-if="page==='multimodal' && current"><div class="page-bar"><div><span class="subject-badge">{{current.subject}}</span><h1>多模态教学内容生成</h1><p>同一知识图谱自动转化为多种学习形态，学生可按偏好选择。</p></div><div class="bar-actions"><button @click="doExport('pptx')">导出可编辑 PPTX</button><button class="primary" @click="doExport('html')">导出互动 HTML</button></div></div><div class="mode-tabs"><button v-for="x in ['沉浸文本','分段测验','PPT 与旁白','双 AI 音频','思维导图','互动教材']" @click="contentStyle=x" :class="{active:contentStyle===x}">{{x}}</button></div><div v-if="contentStyle==='综合模式'||contentStyle==='沉浸文本'" class="multimodal-grid"><article class="panel immersive"><span>沉浸式文本 · {{currentScene.knowledge[0]}}</span><h2>{{currentScene.headline}}</h2><p>{{currentScene.content}}</p><div class="inline-question"><b>边读边想</b><p>这个知识点与“{{current.keyPoints[1]}}”之间有什么联系？</p><input placeholder="写下你的判断，AI 会即时反馈"><button @click="flash('已保存回答，AI 将它加入课堂诊断')">提交</button></div></article><article class="panel visual-card"><div class="generated-visual"><b>{{current.subject}}</b><span>{{currentScene.knowledge.join(' × ')}}</span><i :style="{transform:'scale('+(simulationValue/60)+')'}"></i></div><label>交互参数 {{simulationValue}}<input type="range" min="20" max="100" v-model.number="simulationValue"></label><p>参数变化会驱动示意图、过程解释和嵌入问题同步更新，用于模拟实验与过程探究。</p></article></div><div v-else-if="contentStyle==='分段测验'" class="panel quiz-studio"><div class="quiz-config"><label>题型<select v-model="quizType"><option>选择</option><option>填空</option><option>判断</option></select></label><label>难度<select v-model="quizDifficulty"><option>基础</option><option>中等</option><option>挑战</option></select></label><span>知识点：{{current.quiz[0].knowledge}}</span></div><h2>{{current.quiz[0].question}}</h2><template v-if="quizType==='选择'"><button v-for="(o,i) in current.quiz[0].options" class="option" :class="{correct:showAnswer&&i===current.quiz[0].answer,wrong:showAnswer&&selectedAnswer===i&&i!==current.quiz[0].answer}" @click="answer(i)">{{String.fromCharCode(65+i)}}. {{o}}</button></template><div v-else class="fill-answer"><input :placeholder="quizType==='判断'?'输入：正确 或 错误':'请输入关键词答案'"><button class="primary" @click="showAnswer=true">提交答案</button></div><div v-if="showAnswer" class="analysis"><b>即时反馈 · {{quizDifficulty}}</b>{{current.quiz[0].analysis}} 系统已更新知识点掌握度与后续推荐。</div></div><div v-else-if="contentStyle==='PPT 与旁白'" class="slide-studio"><div class="panel slide-canvas" :class="{spotlight}"><small>{{currentSlide.knowledge}} · {{currentSlide.visual}}</small><h2>{{currentSlide.title}}</h2><ul><li v-for="x in currentSlide.bullets">{{x}}</li></ul><div class="spotlight-ring"></div></div><aside class="panel narration"><h3>PPT 聚光灯与旁白</h3><label><input type="checkbox" v-model="spotlight"> 按知识点自动高亮</label><select><option>沉稳教师声线</option><option>亲切女教师</option><option>英文自然声线</option></select><button class="primary wide" @click="playNarration()">{{narrating?'停止旁白':'▶ 播放本页旁白'}}</button><p>旁白播放时根据知识点时间索引定位当前页面，并自动放大、加粗、改变重点区域背景。</p></aside><div class="slide-controls"><button :disabled="slideIndex===0" @click="nextSlide(-1)">← 上一页</button><span>{{slideIndex+1}} / {{current.demo04.slides.length}}</span><button :disabled="slideIndex===current.demo04.slides.length-1" @click="nextSlide(1)">下一页 →</button></div></div><div v-else-if="contentStyle==='双 AI 音频'" class="podcast panel"><h2>双 AI 角色音频课程</h2><div class="speaker teacher"><b>🧑‍🏫 AI 教师</b><p>{{current.demo04.audioScript.teacher}}</p><button @click="playNarration(current.demo04.audioScript.teacher)">播放教师声线</button></div><div class="speaker student"><b>🧑‍🎓 AI 学生</b><p>{{current.demo04.audioScript.student}}</p><button @click="playNarration(current.demo04.audioScript.student)">播放学生声线</button></div><div class="wave"><i v-for="n in 28" :style="{height:(12+(n%7)*5)+'px'}"></i></div><p>支持多语言 TTS、预设角色声线和双角色讨论脚本；浏览器语音不可用时仍可查看与导出完整脚本。</p></div><div v-else-if="contentStyle==='思维导图'" class="mindmap panel"><div class="mind-root">{{current.demo04.mindMap.root}}</div><div v-for="b in current.demo04.mindMap.branches" class="mind-branch"><b>{{b.name}}</b><span v-for="x in b.children">{{x}}</span></div></div><div v-else class="interactive-book panel"><h2>互动 HTML 教材</h2><div class="process-flow"><button v-for="(s,i) in current.scenes" @click="selectScene(i)" :class="{active:sceneIndex===i}"><b>{{i+1}}</b><span>{{s.title}}</span><small>点击展开</small></button></div><article><h3>{{currentScene.headline}}</h3><p>{{currentScene.content}}</p><div class="knowledge-row"><span v-for="x in currentScene.knowledge">{{x}}</span></div></article></div></section>

<section v-else-if="page==='lesson' && current"><div class="lesson-toolbar"><div><span class="subject-badge">{{current.subject}}</span><h1>{{current.title}}</h1><p>{{current.grade}} · {{current.duration}} 分钟 · {{current.status==='PUBLISHED'?'已审核发布':'AI 草稿待审核'}}</p></div><div class="toolbar-actions"><button @click="publish">{{current.status==='PUBLISHED'?'退回草稿':'✓ 审核并发布'}}</button><button @click="doExport('json')">JSON</button><button @click="doExport('pptx')">PPTX</button><button @click="doExport('html')">HTML</button><button class="primary" @click="doExport('zip')">ZIP 完整课堂包</button></div></div><div class="lesson-layout lesson04"><aside class="scene-nav"><div class="plan-summary"><b>课堂导航</b><span>{{current.scenes.length}} 个场景</span></div><button v-for="(s,i) in current.scenes" :class="{active:sceneIndex===i}" @click="selectScene(i)"><em>{{String(i+1).padStart(2,'0')}}</em><span><b>{{s.title}}</b><small>{{s.duration}} 分钟 · {{s.interaction}}</small></span></button><button class="project-entry" @click="flash('项目任务已加入学生学习路径')">🧭 项目式学习</button></aside><div class="stage"><div class="scene-hero"><div><span>{{currentScene.type}} · {{currentScene.duration}} MIN</span><h2>{{currentScene.headline}}</h2><p>{{currentScene.content}}</p></div><div class="scene-number">{{String(sceneIndex+1).padStart(2,'0')}}</div></div><div class="activity-grid"><article><small>教师活动</small><p>{{currentScene.teacherActivity}}</p></article><article><small>学生活动</small><p>{{currentScene.studentActivity}}</p></article><article><small>互动 / 模拟</small><p>{{currentScene.interaction}}</p></article></div><div class="knowledge-row"><b>图谱约束</b><span v-for="x in currentScene.knowledge">{{x}}</span></div><div class="voice-question"><button @click="startAsr">{{recognizing?'正在听…':'🎙 语音提问'}}</button><form @submit.prevent="askTeacher"><input v-model="aiQuestion" placeholder="向 AI 导师提问，回答后自动生成板书"><button class="primary" :disabled="aiLoading">{{aiLoading?'讲解中…':'提问'}}</button></form></div><div v-if="whiteboard.length" class="auto-board"><div><b>AI 教学白板</b><small>根据本次回答自动生成层级化板书</small></div><ol><li v-for="x in whiteboard">{{x}}</li></ol><button @click="saveWhiteboard">保存到复习资料</button></div><div class="quiz-box" v-if="sceneIndex===current.scenes.length-1"><h3>{{current.quiz[0].question}}</h3><button v-for="(o,i) in current.quiz[0].options" class="option" :class="{correct:showAnswer&&i===current.quiz[0].answer,wrong:showAnswer&&selectedAnswer===i&&i!==current.quiz[0].answer}" @click="answer(i)">{{String.fromCharCode(65+i)}}. {{o}}</button><div v-if="showAnswer" class="analysis">{{current.quiz[0].analysis}}</div></div><div class="stage-footer"><button :disabled="sceneIndex===0" @click="selectScene(sceneIndex-1)">← 上一场景</button><span>课堂进度 <b>{{Math.round((sceneIndex+1)/current.scenes.length*100)}}%</b></span><button :disabled="sceneIndex===current.scenes.length-1" @click="selectScene(sceneIndex+1)">下一场景 →</button></div></div><aside class="design-panel"><h3>AI 导师学习路径</h3><section v-for="p in current.demo04.learningPath"><b>{{p.stage}}</b><p>{{p.reason}}</p><span class="path-state">{{p.status}}</span></section><section><b>课后项目</b><p>{{current.demo04.projectTask.challenge}}</p></section></aside></div></section>

<section v-else-if="page==='agents' && current"><div class="page-bar"><div><span class="subject-badge">{{current.subject}}</span><h1>多智能体协同课堂</h1><p>教师配置角色与数量，AI 同学主动讨论，导师自动板书，记录员实时生成笔记。</p></div><button class="primary" @click="startDiscussion">AI 同学主动发起讨论</button></div><div class="agent-layout"><aside class="panel agent-config"><h3>课堂角色配置</h3><article v-for="a in agents" :class="{off:!a.enabled}"><span>{{a.icon}}</span><div><b>{{a.name}}</b><small>{{a.duty}}</small><em>{{a.voice}}</em></div><button @click="toggleAgent(a)">{{a.enabled?'已启用':'启用'}}</button></article></aside><div class="panel classroom-chat"><div class="chat-head"><div><b>多角色课堂对话</b><small>全部发言会保留在侧边历史中</small></div><span>{{agents.filter(a=>a.enabled).length}} 个角色在线</span></div><div class="chat-list agent-chat"><div v-if="!agentMessages.length" class="chat-empty">点击“AI 同学主动发起讨论”，或向 AI 导师提问。</div><div v-for="m in agentMessages" :class="m.role==='我'?'student':'teacher'"><b>{{m.icon}} {{m.role}} · {{m.time}}</b><p>{{m.content}}</p></div></div><form class="chat-input big" @submit.prevent="askTeacher"><button type="button" @click="startAsr">🎙</button><input v-model="aiQuestion" placeholder="输入回答或问题，AI 导师会触发白板讲解"><button class="primary">发送</button></form><div v-if="whiteboard.length" class="mini-board"><b>AI 导师白板</b><ul><li v-for="x in whiteboard">{{x}}</li></ul></div></div><aside class="panel recorder"><h3>📝 课堂记录员</h3><small>实时重点难点笔记</small><ol><li v-for="x in recorderNotes">{{x}}</li></ol><button @click="doExport('zip')">保存并导出课堂笔记</button></aside></div></section>

<section v-else-if="page==='analytics' && current"><div class="page-bar"><div><span class="subject-badge">{{current.subject}}</span><h1>学习记录与学情分析</h1><p>浏览、测验、学习时长与讨论数据统一形成学生画像和个性化推荐。</p></div><select v-model="studentView"><option>全班</option><option>张同学</option><option>李同学</option><option>王同学</option></select></div><div class="metric-grid analytics-metrics"><article><span>综合掌握度</span><b>{{averageMastery}}%</b><small>较上次 +6%</small></article><article><span>累计学习</span><b>{{totalMinutes}}m</b><small>{{records.length}} 条行为记录</small></article><article><span>测验平均分</span><b>{{Math.round(records.filter(r=>r.score).reduce((n,r)=>n+(r.score||0),0)/(records.filter(r=>r.score).length||1))}}</b><small>含分段测验与讨论评价</small></article><article><span>薄弱知识点</span><b>{{weakNodes.length}}</b><small>已生成强化建议</small></article></div><div class="analytics-layout"><div class="panel mastery-panel"><div class="panel-title"><div><h3>知识点掌握度</h3><small>由测验、互动和学习时长综合计算</small></div><label><input type="checkbox" v-model="weakOnly"> 只看薄弱点</label></div><div v-for="n in masteryNodes" class="mastery-row"><span>{{n.label}}</span><div><i :style="{width:n.mastery+'%'}" :class="{weak:n.mastery<65}"></i></div><b>{{n.mastery}}%</b></div></div><div class="panel profile-panel"><h3>学生画像与推荐</h3><label>兴趣标签<select v-model="interest"><option>科技</option><option>阅读</option><option>音乐</option><option>体育</option><option>游戏</option></select></label><div class="profile-orbit"><b>{{studentView}}</b><span>进度 {{Math.round((sceneIndex+1)/current.scenes.length*100)}}%</span><span>掌握 {{averageMastery}}%</span><span>兴趣 {{interest}}</span></div><h4>AI 诊断</h4><p>对“{{weakNodes[0]?.label||current.keyPoints[0]}}”的条件判断不够稳定，建议使用{{interest}}情境完成一次互动强化，再进入项目任务。</p><button class="primary wide" @click="recommend">生成个性化学习路径</button></div><div class="panel record-panel"><h3>学习行为时间线</h3><article v-for="r in records.slice(0,8)"><i></i><div><b>{{r.action}} · {{r.target}}</b><small>{{r.at}} · {{Math.max(1,Math.round(r.seconds/60))}} 分钟 <template
